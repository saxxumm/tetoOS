# tetoOS's ten-band equalizer sink, driven from the Sound page.
#
# Derived from the six-band example PipeWire ships as
# /usr/share/pipewire/filter-chain/sink-eq6.conf, extended to the classic
# ten-octave graphic-EQ layout and given a stable node name the shell looks for
# by name rather than by node id, which PipeWire reassigns every time the chain
# is rebuilt.
#
# INSTALL
#   install.sh copies this into ~/.config/pipewire/filter-chain.conf.d/
#   and enables the unit that reads it:
#
#     systemctl --user enable --now filter-chain.service
#
#   That unit is `pipewire -c filter-chain.conf`: a second, small PipeWire
#   process that connects to the running daemon as a client. Restarting it to
#   pick up an edit here costs a moment of silence from anything routed through
#   the equalizer and nothing else — the daemon, the session manager and the
#   shell's own connection to them all stay up. That is the whole reason the
#   chain lives in its own service rather than in a pipewire.conf.d drop-in.
#
# Installing it changes nothing on its own: every band starts at 0 dB, and a new
# sink does not become the default output by itself. Nothing is routed through
# the equalizer until you pick it as the output — the player menu has a button
# for that, and the shell never moves the default sink on its own.
#
# NODE NAMES — the shell depends on these
#   The sink the shell talks to is capture.props/node.name below. It must match
#   `sinkName` in quickshell/services/Eq.qml. Rename one and you must rename the
#   other. The ten filter nodes must stay named eq_band_1 … eq_band_10, in that
#   order: the shell addresses a gain as "eq_band_<n>:Gain" and maps band <n> to
#   it positionally.
#
# RETUNING BY HAND
#   * Freq is the corner frequency of a shelf and the centre frequency of a peak.
#   * Q on a peaking biquad sets its bandwidth: 1.41 is roughly one octave, which
#     is what octave-spaced bands want. Lower Q = wider and gentler, higher Q =
#     narrower and more surgical.
#   * Q on a shelf sets its slope. 0.7 (≈ 1/sqrt 2) is the steepest slope that
#     still rises monotonically; above that the shelf overshoots near the corner.
#   * Gain is in dB and is the only control the shell writes at runtime. The
#     values here are the boot defaults — the shell re-applies its saved curve
#     over them once it finds the sink, so editing a Gain here only changes what
#     you hear in the moment before that.
#   * Adding or removing a band means editing the shell too: Eq.qml owns the
#     matching band table, and the player menu draws one column per entry.
#
# WHY builtin BIQUADS
#   This machine has no LADSPA or LV2 plugins installed, so `type = ladspa` and
#   `type = lv2` have nothing to load. The builtin biquads are part of PipeWire
#   itself and need no packages.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "tetoOS Equalizer"
            media.name       = "tetoOS Equalizer"

            filter.graph = {
                # One mono chain of ten biquads in series. filter-chain
                # instantiates it once per channel (audio.channels below) and
                # shares the named controls across the copies, so a single
                # "eq_band_3:Gain" write moves both L and R together.
                nodes = [
                    {
                        # Sub-bass and bass foundation. A shelf rather than a peak
                        # so everything below it moves, including the content the
                        # lowest octave-band peak would miss.
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 32.0 "Q" = 0.7 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 64.0 "Q" = 1.41 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 125.0 "Q" = 1.41 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 250.0 "Q" = 1.41 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 500.0 "Q" = 1.41 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_peaking
                        control = { "Freq" = 1000.0 "Q" = 1.41 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_7
                        label = bq_peaking
                        control = { "Freq" = 2000.0 "Q" = 1.41 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_8
                        label = bq_peaking
                        control = { "Freq" = 4000.0 "Q" = 1.41 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_9
                        label = bq_peaking
                        control = { "Freq" = 8000.0 "Q" = 1.41 "Gain" = 0.0 }
                    }
                    {
                        # Air band. A shelf again, so it keeps lifting above 16 kHz
                        # instead of rolling back off before Nyquist.
                        type  = builtin
                        name  = eq_band_10
                        label = bq_highshelf
                        control = { "Freq" = 16000.0 "Q" = 0.7 "Gain" = 0.0 }
                    }
                ]
                links = [
                    { output = "eq_band_1:Out"  input = "eq_band_2:In"  }
                    { output = "eq_band_2:Out"  input = "eq_band_3:In"  }
                    { output = "eq_band_3:Out"  input = "eq_band_4:In"  }
                    { output = "eq_band_4:Out"  input = "eq_band_5:In"  }
                    { output = "eq_band_5:Out"  input = "eq_band_6:In"  }
                    { output = "eq_band_6:Out"  input = "eq_band_7:In"  }
                    { output = "eq_band_7:Out"  input = "eq_band_8:In"  }
                    { output = "eq_band_8:Out"  input = "eq_band_9:In"  }
                    { output = "eq_band_9:Out"  input = "eq_band_10:In" }
                ]
            }

            audio.channels = 2
            audio.position = [ FL FR ]

            capture.props = {
                # The name the shell resolves to a node id. Keep it in sync with
                # Eq.qml's `sinkName`.
                node.name   = "effect_input.tetoos_eq10"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name    = "effect_output.tetoos_eq10"
                # Passive: the chain only runs a driver when something is actually
                # playing into it, so an idle equalizer sink costs nothing.
                node.passive = true
            }
        }
    }
]
