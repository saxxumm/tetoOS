# tetoOS for Hyprland before 0.55 (hyprland.conf, hyprlang).
#
# The installer copies this to ~/.config/hypr/tetoos.conf with the path to the
# shell filled in, and adds one line to hyprland.conf:
#
#     source = ~/.config/hypr/tetoos.conf
#
# Only shell keys are bound here; windows, workspaces and your own keys stay
# yours. Rebind anything below that clashes with them.

$tetoos = @TETOOS@

exec-once = $tetoos start
exec-once = $tetoos idle
exec-once = sh -c 'command -v cliphist >/dev/null && exec wl-paste --watch cliphist store'

# the phone
bind = SUPER, D, exec, $tetoos ipc launcher
bind = SUPER, N, exec, $tetoos ipc control
bind = SUPER, slash, exec, $tetoos ipc settings
bind = SUPER SHIFT, B, exec, $tetoos ipc wallpapers
bind = SUPER SHIFT, V, exec, $tetoos ipc clipboard
bind = SUPER SHIFT, E, exec, $tetoos ipc power
bind = SUPER ALT, S, exec, $tetoos ipc settingsPage general

# the desktop
bind = SUPER SHIFT, D, exec, $tetoos ipc edit
bind = SUPER SHIFT, period, exec, $tetoos ipc toggleMode
bind = SUPER ALT, Y, exec, $tetoos ipc karaoke
bind = SUPER, L, exec, $tetoos ipc lock

# keys on the keyboard itself: the shell shows the change
bindel = , XF86AudioRaiseVolume, exec, $tetoos ipc volumeUp
bindel = , XF86AudioLowerVolume, exec, $tetoos ipc volumeDown
bindl = , XF86AudioMute, exec, $tetoos ipc mute
bindl = , XF86AudioMicMute, exec, $tetoos ipc micMute
bindel = , XF86MonBrightnessUp, exec, $tetoos ipc brightnessUp
bindel = , XF86MonBrightnessDown, exec, $tetoos ipc brightnessDown
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
